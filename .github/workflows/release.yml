name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: tag + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Type-check
        run: bun run typecheck

      - name: Run the test suite
        run: bun test

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of what
      # some Node images bundle.
      - name: Update npm
        run: npm install -g npm@latest

      # No token anywhere: npm trades the OIDC token for publish rights and
      # attaches a provenance attestation on the way. The package ships its
      # TypeScript sources, so there is nothing to build first.
      - name: Publish
        run: npm publish

  release:
    name: Build binaries and publish to Releases
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Bun cross-compiles every target from one runner.
      - name: Compile a standalone binary per platform
        run: |
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --minify --target="bun-$target" ./bin/overgit.ts --outfile "dist/overgit-$target"
          done
          ./dist/overgit-linux-x64 --version
          (cd dist && sha256sum overgit-* > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub Release with the binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/overgit-* dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes
